<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Segoe UI, system-ui, sans-serif;
      --bg: #07111f;
      --panel: #121a21;
      --panel-2: #1b252d;
      --line: #34454d;
      --text: #f5f7f6;
      --muted: #aab6b1;
      --green: #49d392;
      --yellow: #ffd166;
      --red: #ff5c8a;
      --blue: #4fa3ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    html,
    body,
    #root {
      width: 100%;
      height: 650px;
      min-height: 650px;
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      min-height: 620px;
      border: 1px solid var(--line);
      background: var(--bg);
    }

    .stage {
      position: relative;
      min-height: 620px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 620px;
    }

    .hud {
      position: absolute;
      left: 16px;
      top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      pointer-events: none;
    }

    .debug-status {
      position: absolute;
      right: 12px;
      bottom: 10px;
      color: rgba(245, 247, 246, 0.55);
      font-size: 11px;
      pointer-events: none;
    }

    .pill {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      background: rgba(9, 17, 31, 0.78);
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    aside {
      border-left: 1px solid var(--line);
      background: var(--panel);
      padding: 16px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .stat {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      border-top: 1px solid var(--line);
      padding: 10px 0;
      font-size: 13px;
      color: var(--muted);
    }

    .stat strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: grid;
      gap: 12px;
      margin: 0 0 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .control {
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }

    .cad {
      margin-top: 18px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--panel-2);
    }

    .cad label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    input[type="file"] {
      width: 100%;
      color: var(--muted);
      font-size: 12px;
    }

    .fallback {
      padding: 20px;
      color: var(--text);
      font: 14px Segoe UI, system-ui, sans-serif;
    }

    @media (max-width: 760px) {
      .shell {
        grid-template-columns: 1fr;
      }

      aside {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="shell">
      <section class="stage">
        <canvas id="fallback-canvas"></canvas>
        <div class="hud">
          <span class="pill">Canvas loading</span>
        </div>
        <div class="debug-status">static canvas shell</div>
      </section>
      <aside>
        <h2>Canvas Flow</h2>
        <div class="stat"><span>Status</span><strong>Waiting for script</strong></div>
      </aside>
    </div>
  </div>
  <script>
    window.addEventListener("error", function (event) {
      var status = document.querySelector("#root aside");
      if (status) {
        status.innerHTML = "<h2>Canvas Flow</h2><div class='stat'><span>Script error</span><strong>" +
          String(event.message || "unknown") + "</strong></div>";
      }
    });
    (function () {
      var status = document.querySelector("#root aside strong");
      if (status) status.textContent = "Script booting";
    })();
  </script>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script>
    const INJECTED_CONFIG = null;

    const DEFAULT_CONFIG = {
      settings: {
        shape_model: "simple_body",
        wind_speed: 45.0,
        angle_of_attack_degrees: 6.0,
        front_wing_degrees: 0.0,
        rear_wing_degrees: 0.0,
        chord: 1.0,
        span: 1.0,
        body_length: 1.0,
        body_width: 1.0,
        body_height: 0.12,
        thickness_ratio: 0.12,
        camber: 0.035,
        air_density: 1.225,
        dynamic_viscosity: 1.81e-5,
        reference_area: null,
        frontal_area: null,
        wetted_area: null,
        display_length_scale: 1.0,
        display_width_scale: 1.0
      },
      coefficients: {
        lift_coefficient: 0.0,
        drag_coefficient: 0.3436268194489667,
        skin_friction_coefficient: 0.003736781586240326,
        pressure_drag_coefficient: 0.26639999999999997,
        lift_newtons: 0.0,
        drag_newtons: 51.1445567397356,
        skin_friction_drag_newtons: 11.494246739735592,
        pressure_drag_newtons: 39.650310000000005,
        effective_angle_degrees: 0.0,
        dynamic_pressure_pascals: 1240.3125000000002,
        reference_area_m2: 1.0,
        frontal_area_m2: 0.12,
        wetted_area_m2: 2.4800000000000004,
        reynolds_number: 3045580.110497238,
        flow_regime: "turbulent",
        laminar_boundary_layer_m: 0.002865068372665014,
        turbulent_boundary_layer_m: 0.01868390793120163,
        circulation_m2_s: 0.0,
        lift_per_span_newtons_per_m: 0.0
      }
    };

    function readConfig() {
      return INJECTED_CONFIG || DEFAULT_CONFIG;
    }

    const CONFIG = readConfig();

    function formatReynoldsValue(value) {
      if (Math.abs(value) >= 1000000) return `${(value / 1000000).toFixed(2)}M`;
      if (Math.abs(value) >= 1000) return `${(value / 1000).toFixed(1)}k`;
      return value.toFixed(0);
    }

    if (!window.React || !window.ReactDOM) {
      const root = document.getElementById("root");
      root.querySelector(".hud").innerHTML = `
        <span class="pill">${CONFIG.settings.wind_speed.toFixed(0)} m/s</span>
        <span class="pill">${CONFIG.coefficients.flow_regime}</span>`;
      root.querySelector(".debug-status").textContent = "fallback canvas";
      root.querySelector("aside").innerHTML = `
        <h2>Canvas Flow</h2>
        <div class="stat"><span>CL</span><strong>${CONFIG.coefficients.lift_coefficient.toFixed(3)}</strong></div>
        <div class="stat"><span>CD</span><strong>${CONFIG.coefficients.drag_coefficient.toFixed(3)}</strong></div>
        <div class="stat"><span>Drag</span><strong>${CONFIG.coefficients.drag_newtons.toFixed(0)} N</strong></div>
        <div class="stat"><span>Skin drag</span><strong>${CONFIG.coefficients.skin_friction_drag_newtons.toFixed(0)} N</strong></div>
        <div class="stat"><span>Pressure drag</span><strong>${CONFIG.coefficients.pressure_drag_newtons.toFixed(0)} N</strong></div>
        <div class="stat"><span>Re</span><strong>${formatReynoldsValue(CONFIG.coefficients.reynolds_number)}</strong></div>
        <div class="note">Flow regime is Reynolds-based; true turbulent eddies are not visualized yet.</div>`;
      startCanvas(document.getElementById("fallback-canvas"), CONFIG);
    } else {
      const { createElement: h, useEffect, useRef, useState } = React;

      function WindTunnelDisplay({ initialConfig }) {
        const canvasRef = useRef(null);
        const [config, setConfig] = useState(initialConfig);
        useEffect(() => startCanvas(canvasRef.current, config), [config]);
        return h("div", { className: "shell" },
          h("section", { className: "stage" },
            h("canvas", { ref: canvasRef }),
            h("div", { className: "hud" },
              h("span", { className: "pill" }, `${config.settings.wind_speed.toFixed(0)} m/s`),
              h("span", { className: "pill" }, `${config.settings.angle_of_attack_degrees.toFixed(1)} deg AoA`),
              h("span", { className: "pill" }, `${config.settings.front_wing_degrees.toFixed(1)} deg front`),
              h("span", { className: "pill" }, `${config.settings.rear_wing_degrees.toFixed(1)} deg rear`)
            ),
            h("div", { className: "debug-status" }, "React canvas")
          ),
          h(SidePanel, { config, onConfig: setConfig })
        );
      }

      function SidePanel({ config, onConfig }) {
        const c = config.coefficients;
        return h("aside", null,
          h("h2", null, "Canvas Flow"),
          h("div", { className: "controls" },
            control("Vehicle speed", config.settings.wind_speed, 10, 95, 1, "m/s", (value) => {
              onConfig(recomputeConfig({ ...config.settings, wind_speed: value }));
            }),
            control("Display length", config.settings.display_length_scale ?? 1.0, 0.55, 1.45, 0.05, "x", (value) => {
              onConfig(recomputeConfig({ ...config.settings, display_length_scale: value }));
            }),
            control("Display width", config.settings.display_width_scale ?? 1.0, 0.55, 1.45, 0.05, "x", (value) => {
              onConfig(recomputeConfig({ ...config.settings, display_width_scale: value }));
            })
          ),
          stat("CL", c.lift_coefficient.toFixed(3)),
          stat("CD", c.drag_coefficient.toFixed(3)),
          stat("Lift / downforce", `${c.lift_newtons.toFixed(0)} N`),
          stat("Drag", `${c.drag_newtons.toFixed(0)} N`),
          stat("Skin drag", `${c.skin_friction_drag_newtons.toFixed(0)} N`),
          stat("Pressure drag", `${c.pressure_drag_newtons.toFixed(0)} N`),
          stat("Effective AoA", `${c.effective_angle_degrees.toFixed(1)} deg`),
          stat("Re", formatReynolds(c.reynolds_number)),
          stat("Regime", c.flow_regime),
          stat("Laminar BL", formatLength(c.laminar_boundary_layer_m)),
          stat("Turbulent BL", formatLength(c.turbulent_boundary_layer_m)),
          h("div", { className: "note" }, "Flow regime is Reynolds-based; true turbulent eddies are not visualized yet."),
          h("div", { className: "cad" },
            h("label", null,
              "Future CAD / 3D import",
              h("input", {
                type: "file",
                accept: ".stl,.obj,.step,.stp,.glb,.gltf",
                disabled: true,
                title: "Reserved for future CAD mesh import testing"
              })
            )
          )
        );
      }

      function stat(label, value) {
        return h("div", { className: "stat" }, h("span", null, label), h("strong", null, value));
      }

      function control(label, value, min, max, step, unit, onChange) {
        return h("label", { className: "control" },
          h("div", { className: "control-row" },
            h("span", null, label),
            h("strong", null, `${Number(value).toFixed(step < 1 ? 1 : 0)} ${unit}`)
          ),
          h("input", {
            type: "range",
            min,
            max,
            step,
            value,
            onChange: (event) => onChange(Number(event.target.value))
          })
        );
      }

      function recomputeConfig(settings) {
        const wingModel = settings.shape_model === "wing";
        const [camberDelta, angleDelta, dragDelta] = wingModel ? wingAdjustment(settings) : [0, 0, 0];
        const effectiveAngle = wingModel ? settings.angle_of_attack_degrees + angleDelta : 0;
        const alpha = effectiveAngle * Math.PI / 180;
        const effectiveCamber = settings.camber + camberDelta;
        const liftCoefficient = wingModel ? clamp(2 * Math.PI * (alpha + effectiveCamber), -3.2, 3.2) : 0;
        const dynamicPressure = 0.5 * settings.air_density * settings.wind_speed * settings.wind_speed;
        const reynolds = settings.air_density * Math.abs(settings.wind_speed) * settings.chord /
          Math.max(settings.dynamic_viscosity, 1e-12);
        const laminar = reynolds > 0 ? 5 * settings.chord / Math.sqrt(reynolds) : 0;
        const turbulent = reynolds > 0 ? 0.37 * settings.chord / Math.pow(reynolds, 0.2) : 0;
        const circulation = 0.5 * settings.wind_speed * settings.chord * liftCoefficient;
        const referenceArea = areaOr(settings.reference_area, settings.chord * settings.span);
        const frontalArea = areaOr(settings.frontal_area, settings.body_width * settings.body_height);
        const wettedArea = areaOr(settings.wetted_area, 2 * (
          settings.body_length * settings.body_width +
          settings.body_length * settings.body_height +
          settings.body_width * settings.body_height
        ));
        const skinFrictionCoefficient = skinFrictionCoefficientFor(reynolds);
        const pressureDragCoefficient = pressureDragCoefficientFor(settings, liftCoefficient, dragDelta);
        const skinDrag = dynamicPressure * wettedArea * skinFrictionCoefficient;
        const pressureDrag = dynamicPressure * frontalArea * pressureDragCoefficient;
        const drag = skinDrag + pressureDrag;
        return {
          settings,
          coefficients: {
            lift_coefficient: liftCoefficient,
            drag_coefficient: drag / Math.max(dynamicPressure * frontalArea, 1e-12),
            skin_friction_coefficient: skinFrictionCoefficient,
            pressure_drag_coefficient: pressureDragCoefficient,
            lift_newtons: dynamicPressure * referenceArea * liftCoefficient,
            drag_newtons: drag,
            skin_friction_drag_newtons: skinDrag,
            pressure_drag_newtons: pressureDrag,
            effective_angle_degrees: effectiveAngle,
            dynamic_pressure_pascals: dynamicPressure,
            reference_area_m2: referenceArea,
            frontal_area_m2: frontalArea,
            wetted_area_m2: wettedArea,
            reynolds_number: reynolds,
            flow_regime: flowRegime(reynolds),
            laminar_boundary_layer_m: laminar,
            turbulent_boundary_layer_m: turbulent,
            circulation_m2_s: circulation,
            lift_per_span_newtons_per_m: settings.air_density * settings.wind_speed * circulation
          }
        };
      }

      function wingAdjustment(settings) {
        const front = settings.front_wing_degrees;
        const rear = settings.rear_wing_degrees;
        return [
          0.0014 * front + 0.0019 * rear,
          0.10 * front + 0.16 * rear,
          0.00018 * front * front + 0.00032 * rear * rear
        ];
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function formatReynolds(value) {
        if (Math.abs(value) >= 1000000) return `${(value / 1000000).toFixed(2)}M`;
        if (Math.abs(value) >= 1000) return `${(value / 1000).toFixed(1)}k`;
        return value.toFixed(0);
      }

      function formatLength(value) {
        if (Math.abs(value) < 0.001) return `${(value * 1000000).toFixed(0)} um`;
        if (Math.abs(value) < 1) return `${(value * 1000).toFixed(1)} mm`;
        return `${value.toFixed(3)} m`;
      }

      function areaOr(value, fallback) {
        return Math.max(value == null ? fallback : value, 1e-9);
      }

      function skinFrictionCoefficientFor(reynolds) {
        if (reynolds <= 0) return 0;
        const laminar = 1.328 / Math.sqrt(reynolds);
        const turbulent = 0.074 / Math.pow(reynolds, 0.2);
        if (reynolds < 500000) return laminar;
        if (reynolds > 3000000) return turbulent;
        const blend = (reynolds - 500000) / 2500000;
        return (1 - blend) * laminar + blend * turbulent;
      }

      function pressureDragCoefficientFor(settings, liftCoefficient, flapDragDelta) {
        const referenceArea = areaOr(settings.reference_area, settings.chord * settings.span);
        const frontalArea = areaOr(settings.frontal_area, settings.body_width * settings.body_height);
        const bluntness = frontalArea / Math.max(referenceArea, 1e-9);
        if (settings.shape_model !== "wing") {
          return 0.18 + 0.72 * bluntness;
        }

        const alpha = Math.abs(settings.angle_of_attack_degrees * Math.PI / 180);
        return 0.035 +
          0.18 * bluntness +
          0.22 * settings.thickness_ratio * settings.thickness_ratio +
          0.85 * alpha * alpha +
          0.035 * liftCoefficient * liftCoefficient +
          flapDragDelta;
      }

      function flowRegime(reynolds) {
        if (reynolds < 500000) return "laminar";
        if (reynolds < 3000000) return "transitional";
        return "turbulent";
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        h(WindTunnelDisplay, { initialConfig: CONFIG })
      );
    }

    function startCanvas(canvas, config) {
      if (!canvas) return () => {};
      const ctx = canvas.getContext("2d");
      const state = {
        animationId: 0,
        particles: [],
        lastTime: performance.now(),
        random: mulberry32(17),
        resizeObserver: null,
        lastWidth: 0,
        lastHeight: 0,
      };

      resize();
      resetParticles();
      state.animationId = requestAnimationFrame(frame);
      window.addEventListener("resize", resize);
      if (window.ResizeObserver) {
        state.resizeObserver = new ResizeObserver(resize);
        state.resizeObserver.observe(canvas);
      }

      return () => {
        cancelAnimationFrame(state.animationId);
        window.removeEventListener("resize", resize);
        if (state.resizeObserver) state.resizeObserver.disconnect();
      };

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const scale = window.devicePixelRatio || 1;
        const nextWidth = Math.max(1, Math.floor((rect.width || canvas.clientWidth || 1) * scale));
        const nextHeight = Math.max(1, Math.floor((rect.height || canvas.clientHeight || 1) * scale));
        if (nextWidth === canvas.width && nextHeight === canvas.height) return;
        canvas.width = nextWidth;
        canvas.height = nextHeight;
        state.lastWidth = canvas.clientWidth;
        state.lastHeight = canvas.clientHeight;
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
      }

      function frame(time) {
        if (canvas.clientWidth !== state.lastWidth || canvas.clientHeight !== state.lastHeight) resize();
        const dt = Math.min(0.035, (time - state.lastTime) / 1000);
        state.lastTime = time;
        update(dt);
        draw();
        state.animationId = requestAnimationFrame(frame);
      }

      function update(dt) {
        const body = airfoilBody();
        for (const particle of state.particles) {
          if (particle.sleep > 0) {
            particle.sleep -= dt;
            if (particle.sleep <= 0) spawn(particle);
            continue;
          }

          const velocity = velocityAt(particle.x, particle.y);
          const nextX = particle.x + velocity.x * dt;
          const nextY = particle.y + velocity.y * dt;
          particle.history.push({ x: particle.x, y: particle.y });
          if (particle.history.length > 22) particle.history.shift();

          const localNext = inverseRotate(nextX - body.x, nextY - body.y, body.degrees);
          const hit = insideDisplayBody(localNext, body, 1.0);
          const outside = nextX > width() + 30 || nextX < -100 || nextY < -60 || nextY > height() + 60;
          if (hit) cancelParticle(particle);
          else if (outside) spawn(particle);
          else {
            particle.x = nextX;
            particle.y = nextY;
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width(), height());
        drawBackground();
        drawPressureGlow();
        drawVectorField();
        drawParticles();
        drawFlowBody();
      }

      function drawBackground() {
        ctx.fillStyle = "#07111f";
        ctx.fillRect(0, 0, width(), height());
        ctx.strokeStyle = "#142532";
        ctx.lineWidth = 1;
        for (let y = 0; y < height(); y += 38) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width(), y);
          ctx.stroke();
        }
      }

      function drawPressureGlow() {
        const body = airfoilBody();
        const gradient = ctx.createRadialGradient(body.x, body.y, body.radius, body.x, body.y, body.radius * 3.0);
        gradient.addColorStop(0, "rgba(255, 92, 138, 0.34)");
        gradient.addColorStop(0.45, "rgba(79, 163, 255, 0.16)");
        gradient.addColorStop(1, "rgba(7, 17, 31, 0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width(), height());
      }

      function drawVectorField() {
        const body = airfoilBody();
        const spacing = 58;
        ctx.save();
        ctx.lineWidth = 1.2;
        for (let y = 36; y < height(); y += spacing) {
          for (let x = 36; x < width(); x += spacing) {
            const local = inverseRotate(x - body.x, y - body.y, body.degrees);
            if (insideDisplayBody(local, body, 1.12)) continue;
            const velocity = velocityAt(x, y);
            const magnitude = Math.hypot(velocity.x, velocity.y);
            const length = Math.min(24, Math.max(7, magnitude * 0.055));
            const angle = Math.atan2(velocity.y, velocity.x);
            const hue = Math.min(210, 175 + magnitude * 0.10);
            ctx.strokeStyle = `hsla(${hue}, 95%, 68%, 0.52)`;
            ctx.fillStyle = ctx.strokeStyle;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + Math.cos(angle) * length, y + Math.sin(angle) * length);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + Math.cos(angle) * length, y + Math.sin(angle) * length);
            ctx.lineTo(
              x + Math.cos(angle) * (length - 5) + Math.cos(angle + 2.45) * 4,
              y + Math.sin(angle) * (length - 5) + Math.sin(angle + 2.45) * 4
            );
            ctx.lineTo(
              x + Math.cos(angle) * (length - 5) + Math.cos(angle - 2.45) * 4,
              y + Math.sin(angle) * (length - 5) + Math.sin(angle - 2.45) * 4
            );
            ctx.closePath();
            ctx.fill();
          }
        }
        ctx.restore();
      }

      function drawParticles() {
        ctx.lineCap = "round";
        for (const p of state.particles) {
          if (p.sleep > 0) continue;
          if (p.history.length > 1) {
            ctx.strokeStyle = "#4fa3ff";
            ctx.lineWidth = 1.7;
            ctx.beginPath();
            ctx.moveTo(p.history[0].x, p.history[0].y);
            for (const point of p.history) ctx.lineTo(point.x, point.y);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
          }
          ctx.fillStyle = "#f8fbff";
          ctx.beginPath();
          ctx.arc(p.x, p.y, 1.9, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawFlowBody() {
        const body = airfoilBody();
        ctx.fillStyle = "rgba(216, 222, 233, 0.92)";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.save();
        ctx.translate(body.x, body.y);
        ctx.rotate(body.degrees * Math.PI / 180);
        ctx.scale(body.lengthRadius / body.radius, body.widthRadius / body.radius);
        ctx.beginPath();
        ctx.arc(0, 0, body.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        ctx.strokeStyle = "rgba(255, 209, 102, 0.52)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        const chordStart = rotate(-body.lengthRadius, 0, body.degrees);
        const chordEnd = rotate(body.lengthRadius, 0, body.degrees);
        ctx.moveTo(body.x + chordStart.x, body.y + chordStart.y);
        ctx.lineTo(body.x + chordEnd.x, body.y + chordEnd.y);
        ctx.stroke();
      }

      function velocityAt(x, y) {
        const body = airfoilBody();
        const speed = config.settings.wind_speed * body.pixelsPerMeter * body.timeScale;
        const local = inverseRotate(x - body.x, y - body.y, body.degrees);
        const r = Math.max(Math.hypot(local.x, local.y), body.radius);
        const theta = Math.atan2(local.y, local.x);
        const circulation = config.coefficients.circulation_m2_s *
          body.pixelsPerMeter * body.pixelsPerMeter * body.timeScale;
        const radialVelocity = speed * (1 - (body.radius * body.radius) / (r * r)) * Math.cos(theta);
        const tangentialVelocity =
          -speed * (1 + (body.radius * body.radius) / (r * r)) * Math.sin(theta) +
          circulation / (2 * Math.PI * r);
        const localVelocity = {
          x: radialVelocity * Math.cos(theta) - tangentialVelocity * Math.sin(theta),
          y: radialVelocity * Math.sin(theta) + tangentialVelocity * Math.cos(theta),
        };
        return rotate(localVelocity.x, localVelocity.y, body.degrees);
      }

      function airfoilBody() {
        const lengthScale = Math.min(Math.max(config.settings.display_length_scale ??
          config.settings.body_length / Math.max(config.settings.chord, 0.1), 0.55), 1.45);
        const widthScale = Math.min(Math.max(config.settings.display_width_scale ??
          config.settings.body_width / Math.max(config.settings.body_length, 0.1), 0.55), 1.45);
        const chordPixels = Math.min(width() * 0.36, height() * 0.54) * lengthScale;
        const pixelsPerMeter = chordPixels / Math.max(config.settings.chord, 0.1);
        return {
          x: width() * 0.48,
          y: height() * 0.52,
          chord: chordPixels,
          lengthRadius: chordPixels * 0.5,
          widthRadius: chordPixels * 0.5 * widthScale,
          radius: chordPixels * 0.5 * Math.sqrt(widthScale),
          pixelsPerMeter,
          timeScale: 0.18,
          degrees: config.settings.angle_of_attack_degrees,
        };
      }

      function insideDisplayBody(local, body, scale) {
        const x = local.x / Math.max(body.lengthRadius * scale, 1e-6);
        const y = local.y / Math.max(body.widthRadius * scale, 1e-6);
        return x * x + y * y <= 1.0;
      }

      function airfoilPoints(body) {
        const points = [];
        for (let i = 0; i <= 72; i += 1) {
          const t = i / 72;
          points.push(surfacePoint(body, t, 1));
        }
        for (let i = 72; i >= 0; i -= 1) {
          const t = i / 72;
          points.push(surfacePoint(body, t, -1));
        }
        return points;
      }

      function surfacePoint(body, t, side) {
        const angle = (side > 0 ? Math.PI : -Math.PI) * t;
        const circleX = body.radius * Math.cos(angle);
        const circleY = body.radius * Math.sin(angle);
        const offset = (body.radius * body.radius) / Math.max(body.radius * 1.18 + circleX, body.radius * 0.12);
        const x = circleX + offset - body.radius * 0.42;
        const y = circleY * 0.34;
        const rotated = rotate(x, y, body.degrees);
        return { x: body.x + rotated.x, y: body.y + rotated.y };
      }

      function resetParticles() {
        const count = 120;
        state.particles = Array.from({ length: count }, () => {
          const particle = { x: 0, y: 0, history: [], sleep: 0 };
          spawn(particle);
          return particle;
        });
      }

      function cancelParticle(particle) {
        particle.sleep = 0.45 + state.random() * 0.35;
        particle.history.length = 0;
      }

      function spawn(particle) {
        particle.x = -45 + state.random() * 65;
        particle.y = 26 + state.random() * Math.max(1, height() - 52);
        particle.sleep = 0;
        particle.history.length = 0;
      }

      function width() {
        return canvas.clientWidth;
      }

      function height() {
        return canvas.clientHeight;
      }
    }

    function rotate(x, y, degrees) {
      const a = degrees * Math.PI / 180;
      return { x: x * Math.cos(a) - y * Math.sin(a), y: x * Math.sin(a) + y * Math.cos(a) };
    }

    function inverseRotate(x, y, degrees) {
      return rotate(x, y, -degrees);
    }

    function pointInPolygon(x, y, polygon) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i, i += 1) {
        const pi = polygon[i];
        const pj = polygon[j];
        const crosses = (pi.y > y) !== (pj.y > y);
        if (crosses && x < ((pj.x - pi.x) * (y - pi.y)) / (pj.y - pi.y) + pi.x) {
          inside = !inside;
        }
      }
      return inside;
    }

    function mulberry32(seed) {
      return function next() {
        seed |= 0;
        seed = seed + 0x6d2b79f5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
  </script>
</body>
