<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Segoe UI, system-ui, sans-serif;
      --bg: #07111f;
      --panel: #121a21;
      --panel-2: #1b252d;
      --line: #34454d;
      --text: #f5f7f6;
      --muted: #aab6b1;
      --green: #49d392;
      --yellow: #ffd166;
      --red: #ff5c8a;
      --blue: #4fa3ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      min-height: 620px;
      border: 1px solid var(--line);
      background: var(--bg);
    }

    .stage {
      position: relative;
      min-height: 620px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 620px;
    }

    .hud {
      position: absolute;
      left: 16px;
      top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      pointer-events: none;
    }

    .pill {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      background: rgba(9, 17, 31, 0.78);
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    aside {
      border-left: 1px solid var(--line);
      background: var(--panel);
      padding: 16px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .stat {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      border-top: 1px solid var(--line);
      padding: 10px 0;
      font-size: 13px;
      color: var(--muted);
    }

    .stat strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .cad {
      margin-top: 18px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--panel-2);
    }

    .cad label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    input[type="file"] {
      width: 100%;
      color: var(--muted);
      font-size: 12px;
    }

    .fallback {
      padding: 20px;
      color: var(--text);
      font: 14px Segoe UI, system-ui, sans-serif;
    }

    @media (max-width: 760px) {
      .shell {
        grid-template-columns: 1fr;
      }

      aside {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="application/json" id="config">__CONFIG_JSON__</script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    const CONFIG = JSON.parse(document.getElementById("config").textContent);

    if (!window.React || !window.ReactDOM) {
      document.getElementById("root").innerHTML =
        "<div class='fallback'>React could not load. The Streamlit charts still work; connect to the internet or bundle React locally for this canvas display.</div>";
    } else {
      const { createElement: h, useEffect, useRef } = React;

      function WindTunnelDisplay({ config }) {
        const canvasRef = useRef(null);
        useEffect(() => startCanvas(canvasRef.current, config), [config]);
        return h("div", { className: "shell" },
          h("section", { className: "stage" },
            h("canvas", { ref: canvasRef }),
            h("div", { className: "hud" },
              h("span", { className: "pill" }, `${config.settings.wind_speed.toFixed(0)} m/s`),
              h("span", { className: "pill" }, `${config.settings.angle_of_attack_degrees.toFixed(1)} deg AoA`),
              h("span", { className: "pill" }, `${config.settings.front_wing_degrees.toFixed(1)} deg front`),
              h("span", { className: "pill" }, `${config.settings.rear_wing_degrees.toFixed(1)} deg rear`)
            )
          ),
          h(SidePanel, { config })
        );
      }

      function SidePanel({ config }) {
        const c = config.coefficients;
        return h("aside", null,
          h("h2", null, "Canvas Flow"),
          stat("CL", c.lift_coefficient.toFixed(3)),
          stat("CD", c.drag_coefficient.toFixed(3)),
          stat("Lift / downforce", `${c.lift_newtons.toFixed(0)} N`),
          stat("Drag", `${c.drag_newtons.toFixed(0)} N`),
          stat("Effective AoA", `${c.effective_angle_degrees.toFixed(1)} deg`),
          h("div", { className: "cad" },
            h("label", null,
              "Future CAD / 3D import",
              h("input", {
                type: "file",
                accept: ".stl,.obj,.step,.stp,.glb,.gltf",
                disabled: true,
                title: "Reserved for future CAD mesh import testing"
              })
            )
          )
        );
      }

      function stat(label, value) {
        return h("div", { className: "stat" }, h("span", null, label), h("strong", null, value));
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        h(WindTunnelDisplay, { config: CONFIG })
      );
    }

    function startCanvas(canvas, config) {
      if (!canvas) return () => {};
      const ctx = canvas.getContext("2d");
      const state = {
        animationId: 0,
        particles: [],
        lastTime: performance.now(),
        random: mulberry32(17),
      };

      resize();
      resetParticles();
      state.animationId = requestAnimationFrame(frame);
      window.addEventListener("resize", resize);

      return () => {
        cancelAnimationFrame(state.animationId);
        window.removeEventListener("resize", resize);
      };

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const scale = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.floor(rect.width * scale));
        canvas.height = Math.max(1, Math.floor(rect.height * scale));
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
      }

      function frame(time) {
        const dt = Math.min(0.035, (time - state.lastTime) / 1000);
        state.lastTime = time;
        update(dt);
        draw();
        state.animationId = requestAnimationFrame(frame);
      }

      function update(dt) {
        const body = airfoilBody();
        for (const particle of state.particles) {
          const velocity = velocityAt(particle.x, particle.y);
          const nextX = particle.x + velocity.x * dt;
          const nextY = particle.y + velocity.y * dt;
          particle.history.push({ x: particle.x, y: particle.y });
          if (particle.history.length > 22) particle.history.shift();

          const local = inverseRotate(nextX - body.x, nextY - body.y, config.settings.angle_of_attack_degrees);
          const hit = (local.x / body.a) ** 2 + (local.y / body.b) ** 2 <= 1.0;
          const outside = nextX > width() + 30 || nextX < -100 || nextY < -60 || nextY > height() + 60;
          if (hit || outside) spawn(particle);
          else {
            particle.x = nextX;
            particle.y = nextY;
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width(), height());
        drawBackground();
        drawPressureGlow();
        drawParticles();
        drawAirfoil();
      }

      function drawBackground() {
        ctx.fillStyle = "#07111f";
        ctx.fillRect(0, 0, width(), height());
        ctx.strokeStyle = "#142532";
        ctx.lineWidth = 1;
        for (let y = 0; y < height(); y += 38) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width(), y);
          ctx.stroke();
        }
      }

      function drawPressureGlow() {
        const body = airfoilBody();
        const gradient = ctx.createRadialGradient(body.x, body.y, body.b, body.x, body.y, body.a * 2.8);
        gradient.addColorStop(0, "rgba(255, 92, 138, 0.34)");
        gradient.addColorStop(0.45, "rgba(79, 163, 255, 0.16)");
        gradient.addColorStop(1, "rgba(7, 17, 31, 0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width(), height());
      }

      function drawParticles() {
        ctx.lineCap = "round";
        for (const p of state.particles) {
          if (p.history.length > 1) {
            ctx.strokeStyle = "#4fa3ff";
            ctx.lineWidth = 1.7;
            ctx.beginPath();
            ctx.moveTo(p.history[0].x, p.history[0].y);
            for (const point of p.history) ctx.lineTo(point.x, point.y);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
          }
          ctx.fillStyle = "#f8fbff";
          ctx.beginPath();
          ctx.arc(p.x, p.y, 1.9, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawAirfoil() {
        const body = airfoilBody();
        const points = airfoilPoints(body);
        ctx.fillStyle = "#d8dee9";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (const point of points.slice(1)) ctx.lineTo(point.x, point.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      function velocityAt(x, y) {
        const body = airfoilBody();
        const speed = config.settings.wind_speed * 5.5;
        const angle = config.settings.angle_of_attack_degrees * Math.PI / 180;
        const u0 = Math.cos(angle) * speed;
        const v0 = Math.sin(angle) * speed;
        const dx = x - body.x;
        const dy = y - body.y;
        const r2 = Math.max(dx * dx + dy * dy, body.a * body.b);
        const influence = (body.a * body.a) / r2;
        const circulation = speed * body.chord * (
          (config.coefficients.effective_angle_degrees * Math.PI / 180) + config.settings.camber
        ) * 0.75;
        return {
          x: u0 * (1 - 0.55 * influence) - dy * circulation / r2,
          y: v0 * (1 + 0.30 * influence) + dx * circulation / r2,
        };
      }

      function airfoilBody() {
        const chord = Math.min(width() * 0.44, height() * 0.72);
        return {
          x: width() * 0.48,
          y: height() * 0.52,
          chord,
          a: chord * 0.5,
          b: chord * Math.max(0.035, config.settings.thickness_ratio * 0.34),
        };
      }

      function airfoilPoints(body) {
        const points = [];
        for (let i = 0; i <= 72; i += 1) {
          const t = i / 72;
          points.push(surfacePoint(body, t, 1));
        }
        for (let i = 72; i >= 0; i -= 1) {
          const t = i / 72;
          points.push(surfacePoint(body, t, -1));
        }
        return points;
      }

      function surfacePoint(body, t, side) {
        const x = (t - 0.5) * body.chord;
        const thickness = body.b * 5 * (
          0.2969 * Math.sqrt(Math.max(t, 0)) - 0.1260 * t - 0.3516 * t * t + 0.2843 * t ** 3 - 0.1015 * t ** 4
        ) / 0.12;
        const camber = body.chord * config.settings.camber * Math.sin(Math.PI * t) ** 1.25;
        const rotated = rotate(x, camber + side * thickness, config.settings.angle_of_attack_degrees);
        return { x: body.x + rotated.x, y: body.y + rotated.y };
      }

      function resetParticles() {
        const count = 120;
        state.particles = Array.from({ length: count }, () => {
          const particle = { x: 0, y: 0, history: [] };
          spawn(particle);
          return particle;
        });
      }

      function spawn(particle) {
        particle.x = -45 + state.random() * 65;
        particle.y = 26 + state.random() * Math.max(1, height() - 52);
        particle.history.length = 0;
      }

      function width() {
        return canvas.clientWidth;
      }

      function height() {
        return canvas.clientHeight;
      }
    }

    function rotate(x, y, degrees) {
      const a = degrees * Math.PI / 180;
      return { x: x * Math.cos(a) - y * Math.sin(a), y: x * Math.sin(a) + y * Math.cos(a) };
    }

    function inverseRotate(x, y, degrees) {
      return rotate(x, y, -degrees);
    }

    function mulberry32(seed) {
      return function next() {
        seed |= 0;
        seed = seed + 0x6d2b79f5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
  </script>
</body>
</html>
