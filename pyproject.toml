[project]
name = "aero-lab"
version = "0.1.0"
description = "A local 2D aerodynamics wind tunnel simulator scaffold."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2.0",
    "plotly>=5.20",
    "streamlit>=1.35",
]

[project.scripts]
aero-lab = "aero_lab.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aero_lab*"]

[tool.setuptools.package-data]
"aero_lab.frontend" = ["*.html"]
